[package]
name = "safekey"
version = "1.2.0"
description = "SafeKey — приватный менеджер паролей с локальным шифрованием"
authors = ["Gamegui"]
edition = "2021"

[lib]
name = "safekey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
