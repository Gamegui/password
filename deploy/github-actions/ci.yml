name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Smoke-test сборки (относительные пути для GitHub Pages)
        run: |
          grep -q 'href="./' dist/index.html || (echo 'index.html: ассеты не относительные' && exit 1)
          test -f dist/sw.js && test -f dist/manifest.webmanifest && test -f dist/app-config.js
