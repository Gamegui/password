name: Build desktop apps (Windows .exe / macOS .dmg / Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, bundles: nsis }
          - { os: macos-latest, bundles: app,dmg }
          - { os: ubuntu-22.04, bundles: deb,appimage }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Системные зависимости Linux (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Иконки приложения (из public/icon-512.png)
        run: npx --yes @tauri-apps/cli@2 icon public/icon-512.png
      - name: Сборка SafeKey
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: safekey-desktop-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

# Примечания:
# - Windows: установщик NSIS (.exe). Не подписан — SmartScreen покажет предупреждение
#   («Подробнее» → «Выполнить в любом случае»). Магазины и подпись кода — отдельная история.
# - macOS: .dmg/.app с ad-hoc подписью (signingIdentity "-"). Первый запуск:
#   ПКМ по приложению → «Открыть», либо Системные настройки → Конфиденциальность.
# - Linux: .deb и AppImage.
